<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Little Grocery Run</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="store-background" aria-hidden="true"></div>

  <main class="page">

    <header class="header">
      <h1>My Little Grocery Run</h1>

      <p class="instruction" id="instruction">
        What are we getting today?
      </p>

      <div class="hint">
        <span class="click-hint">
          Click an item to add it to the basket
        </span>

        <span class="keyboard-hint">
          Press <strong>R</strong> to start over
        </span>
      </div>
    </header>

    <section class="grocery-area" aria-label="Interactive grocery basket">

      <!-- Shopping basket -->
      <div class="basket">
        <img
          src="images/basket.png"
          alt="Shopping basket"
          class="basket-image"
        >
      </div>

      <!-- Grocery items -->
      <button
        class="grocery grocery-clinkers"
        type="button"
        aria-label="Add Clinkers to basket"
      >
        <img src="images/clinkers.png" alt="Pascall Clinkers">
      </button>

      <button
        class="grocery grocery-condensed"
        type="button"
        aria-label="Add condensed milk to basket"
      >
        <img src="images/condensed-milk.png" alt="Condensed milk">
      </button>

      <button
        class="grocery grocery-icecream"
        type="button"
        aria-label="Add Ben and Jerry's ice cream to basket"
      >
        <img src="images/icecream.png" alt="Ben and Jerry's ice cream">
      </button>

      <button
        class="grocery grocery-snickers"
        type="button"
        aria-label="Add Snickers to basket"
      >
        <img src="images/snickers.png" alt="Snickers">
      </button>

      <button
        class="grocery grocery-coffee"
        type="button"
        aria-label="Add coffee to basket"
      >
        <img src="images/coffee.png" alt="Coffee">
      </button>

      <button
        class="grocery grocery-gummy"
        type="button"
        aria-label="Add gummy candy to basket"
      >
        <img src="images/gummy.png" alt="Gummy candy">
      </button>

      <button
        class="grocery grocery-kombucha"
        type="button"
        aria-label="Add kombucha to basket"
      >
        <img src="images/kombucha.png" alt="Kombucha">
      </button>

      <button
        class="grocery grocery-cookies"
        type="button"
        aria-label="Add cookies to basket"
      >
        <img src="images/cookies.png" alt="Celebration cookies">
      </button>

      <!-- Basket status -->
      <div class="basket-info">
        <p class="counter" id="counter" aria-live="polite">
          0 / 8 items
        </p>

        <button
          class="reset-button"
          id="resetButton"
          type="button"
        >
          Start over
        </button>
      </div>

    </section>

  </main>

  <!-- Viewport information -->
  <p
    class="screen-message"
    id="screenMessage"
    aria-live="polite"
  ></p>

  <script src="script.js"></script>

</body>
</html>
